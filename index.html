    <script>
        // Safer global error handler: Log full details and show a non-destructive banner.
        window.addEventListener('error', function(event) {
            try {
                console.error('Global error event:', event);

                const details = event.error && (event.error.stack || event.error.message)
                    ? (event.error.stack || event.error.message)
                    : (event.message || 'No stack available. Check DevTools Console & Network tab for blocked/404 scripts.');

                // Don't overwrite the entire document — append a banner so DevTools still usable.
                if (!document.getElementById('arats-error-banner')) {
                    const banner = document.createElement('div');
                    banner.id = 'arats-error-banner';
                    banner.style = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:14px;z-index:9999999;border-bottom:4px solid #b91c1c;font-family:sans-serif;';
                    banner.innerHTML = `<strong>⚠️ System Error Detected!</strong>
                                        <div style="font-size:13px;margin-top:8px;">Issue: ${event.message || 'Script error'}</div>
                                        <div style="font-size:12px;margin-top:6px;white-space:pre-wrap;max-height:160px;overflow:auto;background:#fff0f0;padding:8px;border-radius:6px;">${details}</div>
                                        <div style="margin-top:6px;font-size:12px;color:#6b7280;">Tip: Open Developer Tools → Console & Network to see exact failing resource. If you are seeing "Script error" only, add <code>crossorigin="anonymous"</code> to your external scripts and ensure the CDN responds with CORS headers.</div>`;
                    document.body.appendChild(banner);
                }
            } catch (e) {
                // Fallback — avoid throwing from the error handler itself
                console.error('Error inside error handler:', e);
            }
        });
    </script>
