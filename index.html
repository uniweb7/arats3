
    <!-- Diagnostic loader (temporary) -->
    <script id="arats-diagnostics">
      (function(){
        try {
          const urls = [
            'https://unpkg.com/react@18/umd/react.development.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
            'https://unpkg.com/@babel/standalone/babel.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js',
            'https://cdn.jsdelivr.net/npm/chart.js',
            'https://cdn.tailwindcss.com',
            'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js',
            'https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js'
          ];

          // create panel
          const panel = document.createElement('div');
          panel.id = 'arats-diagnostics-panel';
          panel.style = 'position:fixed;bottom:12px;right:12px;z-index:2147483647;background:#111827;color:#fff;padding:12px;border-radius:8px;font-family:system-ui,Arial,sans-serif;font-size:12px;max-width:380px;box-shadow:0 6px 20px rgba(2,6,23,.6)';
          panel.innerHTML = '<div style="font-weight:800;margin-bottom:8px;">ARATS Diagnostics</div><div id="ad-status" style="max-height:220px;overflow:auto;margin-bottom:8px;"></div><div style="display:flex;gap:8px"><button id="ad-copy" style="flex:1;padding:6px 8px;border-radius:6px;border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;">Copy report</button><button id="ad-close" style="padding:6px 8px;border-radius:6px;border:0;background:#374151;color:#fff;font-weight:700;cursor:pointer;">Close</button></div>';
          document.body.appendChild(panel);
          const statusEl = document.getElementById('ad-status');
          const results = [];

          const addLine = (t) => { const el = document.createElement('div'); el.style.padding='6px 0'; el.innerHTML = t; statusEl.appendChild(el); };

          let pending = urls.length;
          urls.forEach(u => {
            const s = document.createElement('script');
            s.src = u;
            s.crossOrigin = 'anonymous';
            s.onload = function(){ results.push({url:u, ok:true}); addLine(`✅ ${u}`); pending--; if(pending===0) finish(); };
            s.onerror = function(e){ results.push({url:u, ok:false}); addLine(`❌ ${u}`); pending--; if(pending===0) finish(); };
            // do not append duplicate tags if already present
            if (!document.querySelector('script[src="'+u+'"]')) document.head.appendChild(s);
          });

          function finish(){
            const ok = results.filter(r=>r.ok).length;
            const fail = results.filter(r=>!r.ok).length;
            addLine(`<hr style="border:none;border-top:1px solid #374151;margin:6px 0">Summary: <b style=\"color:#34d399\">${ok} OK</b> | <b style=\"color:#fb7185\">${fail} Failed</b>`);
            document.getElementById('ad-copy').onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(results,null,2)); alert('Copied report to clipboard. Paste here.'); };
            document.getElementById('ad-close').onclick = ()=>{ panel.remove(); };
          }
        } catch(ex) { console.error('Diagnostics failed:', ex); }
      })();
    </script>
